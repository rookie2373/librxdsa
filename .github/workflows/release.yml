name: Production Release
on:
  push:
    tags:
      - '*.*.*'
jobs:
  build:
    name: build ${{ github.ref_name }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate_tag.outputs.version }}
    steps:
      - name: Checkout source ${{ github.ref_name }}
        id: checkout_source
        uses: actions/checkout@v4

      - name: Validate tag ${{ github.ref_name }}
        id: validate_tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a valid version like 0.0.1"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Build brew archive
        id: build_brew_archive
        run: |
          git archive --format=tar.gz --prefix=librxdsa-${{ github.ref_name }}/ -o librxdsa-${{ github.ref_name }}.tar.gz HEAD

      - name: MinGW install
        id: mingw_install
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: Build winget binary
        id: build_winget_binary
        run: |
          make clean-build
          make CC=x86_64-w64-mingw32-gcc AR=x86_64-w64-mingw32-ar lib

          mkdir -p ${{ github.ref_name }}/lib
          mkdir -p ${{ github.ref_name }}/include

          cp librxdsa.a ${{ github.ref_name }}/lib/
          cp -r include/* ${{ github.ref_name }}/include/

          zip -r librxdsa-${{ github.ref_name }}.zip ${{ github.ref_name }}/
      
      - name: Upload build artifacts
        id: upload_build_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            librxdsa-${{ github.ref_name }}.tar.gz
            librxdsa-${{ github.ref_name }}.zip

  brew-release:
    name: brew-release ${{ github.ref_name }}
    needs: [build, debian-minimal-release, redhat-minimal-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        id: download_build_artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Create release ${{ github.ref_name }}
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/librxdsa-${{ github.ref_name }}.tar.gz
            release-artifacts/librxdsa-${{ github.ref_name }}.zip
            debian-package/librxdsa-${{ github.ref_name }}-amd64.deb
            redhat-package/librxdsa-${{ github.ref_name }}-1.x86_64.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Brew deploy ${{ github.ref_name }}
        id: deploy_brew
        run: |
          VERSION="${{ needs.build.outputs.version }}"

          URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/librxdsa-${VERSION}.tar.gz"
          SHA256_HASH=$(sha256sum "release-artifacts/librxdsa-${VERSION}.tar.gz" | awk '{ print $1 }')

          echo "Triggering Homebrew update for version ${VERSION}"

          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.HOMEBREW_DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository_owner }}/homebrew-librxdsa/dispatches" \
            -d "{\"event_type\": \"update_formula\", \"client_payload\": {\"version\": \"${VERSION}\", \"url\": \"${URL}\", \"sha256\": \"${SHA256_HASH}\"}}"
  
  pacman-minimal-release:
    name: pacman-minimal-release ${{ github.ref_name }}
    needs: [build, brew-release]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository structure
        uses: actions/checkout@v4

      - name: Install packaging tools
        id: install_package_tools
        run: |
          pacman -Syu --noconfirm git openssh pacman-contrib base-devel

      - name: Download build artifacts
        id: download_build_artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Validate PKGBUILD execution
        id: validate_pkgbuild_execution
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p mock_build
          cp PKGBUILD mock_build/PKGBUILD
          cd mock_build

          sed -i "s/pkgver=.*/pkgver=${VERSION}/g" PKGBUILD
          sed -i "s/pkgrel=.*/pkgrel=1/g" PKGBUILD

          cp ../release-artifacts/librxdsa-${VERSION}.tar.gz ./librxdsa-${VERSION}.tar.gz

          useradd -m builduser
          chown -R builduser:builduser .
          sudo -u builduser updpkgsums
          
          sudo -u builduser makepkg -s --noconfirm
          echo "✓ Successfully validated package build workflow local compilation"

