  debian-minimal-release:
    name: debian-minimal-release ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        id: download_build_artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Build debian_pkg ${{ github.ref_name }}
        id: build_deb_pkg
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          tar -xzf librxdsa-${VERSION}.tar.gz
          cd librxdsa-${VERSION}
          
          make clean-build
          make lib
          cd ..

          mkdir -p debian_pkg/DEBIAN
          mkdir -p debian_pkg/usr/lib
          mkdir -p debian_pkg/usr/include/rxdsa

          cp librxdsa-${VERSION}/librxdsa.a debian_pkg/usr/lib/
          cp librxdsa-${VERSION}/include/*.h debian_pkg/usr/include/rxdsa/

          cat <<EOF > debian_pkg/DEBIAN/control
          Package: librxdsa
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Rushikesh Kundkar <rrkundkar777@gmail.com>
          Section: libs
          Priority: optional
          Depends: libc6
          Description: Standalone and lightweight C algorithms library
          EOF

          dpkg-deb --build debian_pkg "librxdsa-${VERSION}-amd64.deb"

      - name: Upload debian package
        id: upload_debian_package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: librxdsa-${{ github.ref_name }}-amd64.deb


  redhat-minimal-release:
    name: redhat-minimal-release ${{ github.ref_name }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        id: download_build_artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Install rpm build tools
        id: install_rpm_build_tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build rpm package
        id: build_rpm_package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p rpmbuild/SOURCES rpmbuild/SPECS rpmbuild/BUILD rpmbuild/RPMS rpmbuild/SRPMS
          
          cp release-artifacts/librxdsa-${VERSION}.tar.gz rpmbuild/SOURCES/
          
          cat <<EOF > rpmbuild/SPECS/librxdsa.spec
          Name:           librxdsa
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        Standalone and lightweight C algorithms library
          License:        GPLv3
          URL:            https://github.com/rookie2373/librxdsa
          Source0:        librxdsa-%{version}.tar.gz

          %description
          Standalone and lightweight C algorithms library.

          %prep
          %setup -q

          %build
          make clean-build
          make lib

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}/usr/lib
          mkdir -p %{buildroot}/usr/include/rxdsa
          cp librxdsa.a %{buildroot}/usr/lib/
          cp include/*.h %{buildroot}/usr/include/rxdsa/

          %files
          %defattr(-,root,root,-)
          /usr/lib/librxdsa.a
          %dir /usr/include/rxdsa
          /usr/include/rxdsa/*.h

          %changelog
          * Thu Sep 03 2026 Rushikesh Kundkar <rrkundkar777@gmail.com> - %{version}-1
          - Automated native binary deployment release updates
          EOF

          rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/librxdsa.spec

          cp rpmbuild/RPMS/x86_64/librxdsa-${VERSION}-1*.rpm ./librxdsa-${VERSION}-1.x86_64.rpm

      - name: Upload RedHat package
        id: upload_redhat_package
        uses: actions/upload-artifact@v4
        with:
          name: redhat-package
          path: librxdsa-${{ github.ref_name }}-1.x86_64.rpm